  <div class="subtle">从原文到记忆，再到一次回答。<br>查看证据，不猜测内部过程。</div>
  <nav class="nav" aria-label="主导航">
   <button data-view="runs" class="active"><span>01　请求追踪</span><span class="count" id="runs-count">0</span></button>

  </nav>
  <div class="sidebar-footer"><strong>本地 · 只读 Inspector</strong>本地后台读取 SQLite 和日志。<br>不执行记忆操作，不调用模型。<br><br>离线重算、在线实验与修改记忆不在本版范围内。</div>
 </aside>
 <main class="main">

  <div id="banner" class="banner"></div><div id="message" class="message" role="alert"></div>
  <section class="metrics" id="metrics" aria-label="当前导入包统计"></section>
  <div class="toolbar"><input id="search" class="search" placeholder="搜索请求、原文、状态、记忆或调用…" aria-label="搜索当前页面"><select id="status-filter" aria-label="按状态筛选"><option value="all">全部状态</option><option value="problem">异常 / 未完成</option><option value="completed">已完成</option></select><span class="pill" id="data-scope">仅当前导入包</span></div>
  <div id="scope-note" class="section-caption"></div>
  <div id="content"></div>

 </main>

function stageInfo(span){
 const suffix=span.name.match(/ · 第 \d+ 次发送$/)?.[0]||'',base=span.name.slice(0,span.name.length-suffix.length);
 const key=base.startsWith('MCP 接收/服务端响应 ')?'rpc_response':STAGE_ALIASES[base]||base;
 const info=STAGE_INFO[key];
 let name=info?.[0]||base;
 if(key==='rpc_response'&&span.status==='in_progress')return {name:'向调用方返回：任务仍在执行',description:'本次等待已达 45 秒，后台任务尚未结束。先通知调用方用相同参数继续等待同一任务，不重新启动抽取或新增模型调用。这是一次状态通知，不是新的记忆处理步骤；“处理中”是当时的状态，不代表现在仍未完成。'};
 if(key==='rpc_response')name='记录工具结果响应';
 if(key==='transaction_committed'&&span.status==='completed'){
  const changes=sourceTransactionChanges(span.output),memories=transactionChanges(span.output);
  const kind=sourceTransactionKind(span);
  if(kind==='capture')return {name:'保存原文并建立索引',description:'独立保存收到的原文并建立本地索引，后续结构化整理失败不会撤销这次保存。'};
  if(kind==='enrichment')return {name:'记录结构化整理状态',description:'记录已保存原文的整理状态、尝试次数和错误原因，本次事务未修改原文正文或索引，也没有结构化记忆变更。'};
  if(changes?.rows.length&&memories?.total===0)name='提交原文变更';
 }
 return {name:name+suffix,description:info?.[1]||'此阶段由导入记录定义。请展开查看实际输入、输出与状态；当前没有更具体的步骤说明。'};
}

let stageHelpButton=null,stageHelpTimer=null;
function hideStageHelp(){clearTimeout(stageHelpTimer);$('stage-tooltip').hidden=true;stageHelpButton=null;}
function showStageHelp(button){
 clearTimeout(stageHelpTimer);stageHelpButton=button;
 const tip=$('stage-tooltip');tip.textContent=button.dataset.stageInfo;tip.hidden=false;
 const rect=button.getBoundingClientRect();
 tip.style.left=Math.max(12,Math.min(rect.left,window.innerWidth-tip.offsetWidth-12))+'px';
 tip.style.top=Math.max(12,rect.bottom+8+tip.offsetHeight>window.innerHeight?rect.top-tip.offsetHeight-8:rect.bottom+8)+'px';

function stageHelpTarget(event){return event.target.closest('.stage-info, #stage-tooltip');}
document.addEventListener('pointerover',event=>{const target=stageHelpTarget(event);if(!target)return;clearTimeout(stageHelpTimer);if(target.dataset.stageInfo)showStageHelp(target);});
document.addEventListener('pointerout',event=>{if(stageHelpTarget(event)&&!event.relatedTarget?.closest('.stage-info, #stage-tooltip'))stageHelpTimer=setTimeout(hideStageHelp,150);});
document.addEventListener('focusin',event=>{const button=event.target.closest('.stage-info');if(button)showStageHelp(button);});
document.addEventListener('focusout',event=>{if(event.target.closest('.stage-info'))hideStageHelp();});
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&stageHelpButton){hideStageHelp();event.preventDefault();}});

function retrievalDecisionKind(decision){
 if(decision==='Selected'||decision==='Mandatory')return decision;
 if(decision&&typeof decision==='object')return ['Filtered','Conflict'].find(key=>Object.hasOwn(decision,key))||null;
 return null;
}
function retrievalReason(decision){
 const kind=retrievalDecisionKind(decision),reason=decision?.[kind];
 if(kind==='Mandatory')return '全局必带要求';
 if(kind==='Selected')return '通过检索规则并被选中';
 if(kind==='Filtered'){
  if(reason&&typeof reason==='object'&&Object.hasOwn(reason,'OverriddenBy'))return `本次由${linkMemoryId(reason.OverriddenBy)} 优先覆盖`;
  return ({Status:'状态不符合本次查询',Temporal:'时间不匹配',Entity:'主体不匹配',Predicate:'属性不匹配',Target:'目标不匹配',Scope:'适用范围不匹配',Limit:'超过普通结果数量上限'})[reason]||`过滤原因：${esc(typeof reason==='object'?JSON.stringify(reason):reason??'未采集')}`;
 }
 if(kind==='Conflict')return `与${linkMemoryId(reason?.with)} 冲突：${esc(({EqualSpecificity:'相同优先级的内容不一致',SlotAlreadyConflicted:'同一属性已有未解决冲突'})[reason?.reason]||JSON.stringify(reason?.reason??'原因未采集'))}`;
 return '选择原因未采集';
}
function retrievalMemoryItem(record,id,decision,reference=null){
 // Only an exact, unique snapshot match can link a historical stage to a version.
 const version=reference||recordedMemoryRef(record);
 const stored=reference?memory(reference):null;
 const content=record?`${record.subject_id??'主体未采集'} · ${record.predicate??'属性未采集'}：${typeof record.value?.Text==='string'?record.value.Text:JSON.stringify(record.value)??'值未采集'}`:stored?.content??'内容未随本阶段记录';
 return `<div class="retrieval-item"><div>${version?linkMem(version):`<span>${linkMemoryId(id)}</span> <span class="muted">未关联唯一历史版本</span>`}</div><div class="retrieval-content">${esc(content)}</div><div class="muted">${retrievalReason(decision)}</div></div>`;
}
function renderRetrievalDetail(span){
 const output=span.output||{},result=output.result,runtime=output.runtime;
 const trace=Array.isArray(result?.trace)?result.trace:null;
 const completeTrace=trace!==null&&trace.every(entry=>retrievalDecisionKind(entry?.decision));
 const snapshot=id=>{const matches=(Array.isArray(output.memories)?output.memories:[]).filter(m=>m&&String(m.id)===String(id));return matches.length===1?matches[0]:null;};
 const selected=Array.isArray(output.selected_refs)?output.selected_refs.map(reference=>retrievalMemoryItem(null,reference,null,reference)):selectedMemoryCount(result)!==null?['mandatory','constraints','preferences','facts','episodes'].flatMap(lane=>result[lane].map(record=>retrievalMemoryItem(record,record?.id??'未采集',lane==='mandatory'?'Mandatory':'Selected'))):null;
 const rows=kind=>trace?.filter(entry=>retrievalDecisionKind(entry?.decision)===kind).map(entry=>retrievalMemoryItem(snapshot(entry.memory_id),entry.memory_id,entry.decision));
 const section=(title,items,empty,missing,complete=true)=>`<section class="retrieval-section" aria-label="${title}"><h4>${title}<span class="count-label">${items&&(items.length||complete)?`${complete?'':'已记录 '}${items.length} 条`:'未采集'}</span></h4>${items?.length?`<div class="retrieval-items">${items.join('')}</div>`:`<div class="muted small">${items&&complete?empty:missing}</div>`}</section>`;
 const conditionValue=value=>!present(value)||Array.isArray(value)&&!value.length?'未指定':typeof value==='object'?JSON.stringify(value):value;
 const conditions=runtime&&typeof runtime==='object'?`<div class="facts">${[
  ['查询主体',Array.isArray(runtime.entities)?runtime.entities.map(id=>id==='self'?'本人（self）':id).join('、'):runtime.entities],
  ['属性范围',runtime.predicates],['目标',runtime.targets],['领域',runtime.domain],['任务',runtime.task_id],['适用情境',runtime.conditions],
  ['时间模式',({Current:'当前',Historical:'历史'})[runtime.temporal_intent]||runtime.temporal_intent],['时间筛选',runtime.temporal_filter],
  ['查询基准时间（Unix 秒）',runtime.at],['普通结果上限',runtime.limit]
 ].map(([label,value])=>fact(label,conditionValue(value))).join('')}</div><p class="muted small">展示进入检索器时的条件；内部事件时间解析未单独采集。普通结果上限不包含全局必带要求。</p>${raw('完整检索条件',runtime)}`:'<div class="muted small">未采集本阶段的检索条件。</div>';
 return `${span.status!=='completed'?'<div class="notice warn">本阶段尚未完成，以下仅展示已记录的明细。</div>':''}<section class="retrieval-section" aria-label="检索条件"><h4>检索条件</h4>${conditions}</section>${section('选中记忆',selected,'本阶段未选中记忆。','未采集选中记忆明细。')}${trace&&!completeTrace?'<div class="notice warn">部分检索决定无法识别，下列仅展示已识别的过滤与冲突明细；完整记录见下方。</div>':''}${section('过滤记忆及原因',rows('Filtered'),'本阶段没有过滤记忆。','未采集过滤记忆明细。',completeTrace)}${section('冲突记忆',rows('Conflict'),'本阶段没有冲突记忆。','未采集冲突记忆明细。',completeTrace)}<p class="muted small">过滤原因是本次记录的首个过滤决定；“本次优先覆盖”不表示删除或永久替换记忆。</p>`;
}

  if(sameRecordedValue(old,next))continue;
  const kind=!old?.request&&next?.request?'新增原文':old?.request&&!next?.request?'删除原文':'更新原文记录';

function transactionChanges(output){

function executionSections(run){

  else if(name==='run_start'||name.startsWith('initial_snapshot'))section='entry';
  else if(name==='rpc_response'||name.startsWith('MCP 接收/服务端响应 '))section=span.status==='in_progress'?'notification':'response';

function renderExecution(run){

function navigateRunHash(){
 const match=/^#run=(.*)$/.exec(location.hash||'');
 if(!bundle||!match)return false;
 let target;try{target=decodeURIComponent(match[1]);if(!target)throw new Error('empty');}catch{view='runs';runIdFilter=location.hash;selectedRun=null;render();showError('请求链接地址无效');return true;}
 view='runs';runIdFilter=target;selectedRun=target;memoryIdFilter=null;
 hideMessage();query='';filter='all';$('search').value='';$('status-filter').value='all';render();window.scrollTo(0,0);return true;
}
function navigateDetailHash(){return navigateRunHash()||navigateMemoryHash()||navigateSourceHash();}
function navigateSourceHash(){
 const match=/^#source=(.*)$/.exec(location.hash||'');
 if(!bundle||!match)return false;
 let target;try{target=decodeURIComponent(match[1]);if(!target)throw new Error('empty');}catch{view='sources';sourceIdFilter=location.hash;selectedSource=null;render();showError('原文链接地址无效');return true;}
 const keepScroll=view==='sources';
 view='sources';sourceIdFilter=target;selectedSource=target;runIdFilter=null;memoryIdFilter=null;
 hideMessage();query='';$('search').value='';render();if(!keepScroll)window.scrollTo(0,0);return true;
}
function navigateMemoryHash(){
 const match=/^#(memory|memory-id)=(.*)$/.exec(location.hash||'');
 if(!bundle||!match)return false;
 let target;try{target=decodeURIComponent(match[2]);if(!target)throw new Error('empty');}catch{view='memories';memoryIdFilter=null;selectedMemory=location.hash;render();showError('记忆链接地址无效');return true;}
 const byId=match[1]==='memory-id',targetId=byId?target:memory(target)?.id;
 const keepScroll=view==='memories'&&memoryIdFilter!==null&&memoryIdFilter===String(targetId);
 view='memories';runIdFilter=null;memoryIdFilter=present(targetId)?String(targetId):null;
 const versions=byId?memoryVersions(memoryIdMatches(target)):[];
 selectedMemory=byId?(versions.length===1?ref(versions[0]):null):target;
 hideMessage();query='';memFilter='all';$('search').value='';render();if(!keepScroll)window.scrollTo(0,0);return true;
}
window.addEventListener('hashchange',()=>{if(!navigateDetailHash()&&bundle)activate('runs');});
function activate(v){clearDetailRoute();view=v;query='';filter='all';$('search').value='';$('status-filter').value='all';render();window.scrollTo(0,0);}
document.addEventListener('click',e=>{
 const b=e.target.closest('button, a[data-memory], a[data-memory-id], a[data-run-link], a[data-source]');
 if(!b){if(!e.target.closest('#stage-tooltip'))hideStageHelp();return;}
 if(b.dataset.stageInfo){e.preventDefault();showStageHelp(b);return;}
 hideStageHelp();
 if(b.dataset.listSelection){
  e.preventDefault();
  if(b.dataset.run)selectedRun=b.dataset.run;
  else if(b.dataset.memory)selectedMemory=b.dataset.memory;
  else if(b.dataset.call)selectedCall=b.dataset.call;
  else if(b.dataset.source){clearDetailRoute();selectedSource=b.dataset.source;}
  render();return;
 }
 if(b.dataset.source){
  if(e.metaKey||e.ctrlKey||e.shiftKey||e.altKey||e.button>0)return;
  e.preventDefault();location.hash='#source='+encodeURIComponent(b.dataset.source);navigateSourceHash();return;
 }
 if(b.dataset.runLink){
  if(e.metaKey||e.ctrlKey||e.shiftKey||e.altKey||e.button>0)return;
  e.preventDefault();location.hash='#run='+encodeURIComponent(b.dataset.run);navigateRunHash();return;
 }
 if(b.dataset.memory||b.dataset.memoryId){
  if(e.metaKey||e.ctrlKey||e.shiftKey||e.altKey||e.button>0)return;
  e.preventDefault();location.hash=b.dataset.memory?'#memory='+encodeURIComponent(b.dataset.memory):'#memory-id='+encodeURIComponent(b.dataset.memoryId);
  navigateMemoryHash();return;
 }
 if(b.dataset.view){activate(b.dataset.view);return;}
 if(b.dataset.run){view='runs';selectedRun=b.dataset.run;query='';filter='all';$('search').value='';$('status-filter').value='all';render();window.scrollTo(0,0);return;}
 if(b.dataset.call){clearDetailRoute();view='calls';selectedCall=b.dataset.call;query='';filter='all';$('search').value='';$('status-filter').value='all';render();window.scrollTo(0,0);return;}
});
$('search').addEventListener('input',e=>{clearDetailRoute();query=e.target.value;render()});$('status-filter').addEventListener('change',e=>{filter=e.target.value;render()});
$('demo-failure').addEventListener('click',()=>{stopLive('演示模式 · 自动刷新已停止');clearDetailRoute();view='runs';load(DEMO_FAILURE)});$('demo-versions').addEventListener('click',()=>{stopLive('演示模式 · 自动刷新已停止');clearDetailRoute();view='runs';load(DEMO_VERSIONS)});
$('import-button').addEventListener('click',()=>{$('file-input').value='';$('file-input').click()});
$('file-input').addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;if(f.size>20*1024*1024){showError('文件超过 20 MiB。请按运行或用户范围导出较小记录包。');return;}try{const imported=JSON.parse(await f.text());validate(imported);stopLive('文件导入模式 · 自动刷新已停止');load(imported)}catch(x){showError('无法读取 JSON：'+x.message)}});
$('export-button').addEventListener('click',()=>{if(!bundle)return;const b=new Blob([JSON.stringify(sanitize(bundle),null,2)],{type:'application/json;charset=utf-8'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='memory-inspector-export.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)});
function renderLogs(){
 const logs=bundle.live?.logs||[];
 $('content').innerHTML=bundle.live?`<div class="snapshot">数据库：${esc(bundle.live.database)} · owner：${esc(bundle.live.owner)}<br>${esc(bundle.live.observability)}</div>${bundle.live.errors.map(x=>`<div class="notice bad">${esc(x)}</div>`).join('')}${logs.map(log=>`<section class="panel" style="margin-bottom:14px"><div class="panel-head"><h3>${esc(log.name)}</h3><span>${log.status==='available'?'可读取':log.status==='privacy_filtered'?'隐私过滤':'不可读取'}</span></div><div class="panel-body"><div class="small muted">${esc(log.path)}<br>最后修改：${val(log.modified_at)} · ${num(log.size_bytes)} bytes${log.truncated?' · 仅展示最近 64 KiB / 100 行':''}${log.final_line_complete===false?' · 末行尚未写完':''}</div>${log.error?`<div class="notice bad">${esc(log.error)}</div>`:''}<pre class="text-box mono small">${esc(log.lines.filter(line=>!query||line.toLowerCase().includes(query.toLowerCase())).join('\n')||(log.status==='privacy_filtered'?'privacy_filtered：日志正文已按当前隐私状态隐藏，不能解释为无记录。':'没有匹配日志行'))}</pre></div></section>`).join('')}`:'<div class="empty">历史包不包含实时日志。点击“查看当前数据”连接本机后台。</div>';
}
let liveMode=false,liveTimer=null,liveGeneration=0,lastLiveRevision=null;
function stopLive(message){liveMode=false;liveGeneration++;clearTimeout(liveTimer);$('live-status').textContent=message;}
async function pollLive(){
 if(!liveMode)return;const generation=liveGeneration;const abort=new AbortController();const timeout=setTimeout(()=>abort.abort(),5000);
 try{
  const response=await fetch('/api/live',{cache:'no-store',signal:abort.signal});
  if(!response.ok)throw new Error(`HTTP ${response.status}`);
  const next=sanitize(await response.json());validate(next);
  if(generation!==liveGeneration)return;
  if(lastLiveRevision!==next.live.revision){
   const opened=[...document.querySelectorAll('#content details')].map((d,i)=>d.open?i:-1);
   const scroll=window.scrollY,initial=lastLiveRevision===null;
   bundle=next;warnings=validate(next);lastLiveRevision=next.live.revision;
   if(!initial||!navigateDetailHash())render();document.querySelectorAll('#content details').forEach((d,i)=>{if(opened.includes(i))d.open=true;});window.scrollTo(0,scroll);
  }
  $('live-status').textContent=`${next.live.status==='partial'?'数据源异常':'已连接'} · 每 2 秒读取 · 最近成功读取 ${new Date(next.live.captured_at).toLocaleTimeString()}`;
 }catch(error){if(generation===liveGeneration)$('live-status').textContent=`连接失败（${error.message}）· 保留上次数据，正在重试`;}
 finally{clearTimeout(timeout);if(liveMode&&generation===liveGeneration)liveTimer=setTimeout(pollLive,2000);}
}
function startLive(){stopLive('正在连接…');liveMode=true;lastLiveRevision=null;pollLive();}
$('live-connect').addEventListener('click',()=>{view='memories';startLive();});
$('live-pause').addEventListener('click',()=>stopLive('已暂停刷新 · 当前显示上次读取的数据'));
$('live-archive').addEventListener('click',async()=>{stopLive('历史模式 · 自动刷新已停止');const generation=liveGeneration;try{const response=await fetch('/api/recorded',{cache:'no-store'});if(!response.ok)throw new Error(`HTTP ${response.status}`);const data=await response.json();if(generation!==liveGeneration)return;clearDetailRoute();view='runs';load(data);}catch(error){showError('历史记录读取失败：'+error.message);}});
if(location.protocol==='http:'&&location.hostname==='127.0.0.1'){$('live-controls').hidden=false;view='memories';startLive();}else{load(DEMO_FAILURE);}
</script>
